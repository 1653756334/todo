services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: Dockerfile.storage
      target: minio
    image: todo-minio:2025-04-22
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    restart: unless-stopped
  init-storage:
    build:
      context: .
      dockerfile: Dockerfile.storage
      target: mc
    image: todo-mc:2025-04-16
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/"$$MINIO_BUCKET"
        mc anonymous set none local/"$$MINIO_BUCKET"
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]},{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]}]}' "$$MINIO_BUCKET" "$$MINIO_BUCKET" > /tmp/todo-policy.json
        mc admin policy create local todo-assets /tmp/todo-policy.json
        mc admin policy attach local todo-assets --user "$$MINIO_ACCESS_KEY"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-todo-private}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set application MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set application MINIO_SECRET_KEY}
    depends_on: [minio]
    restart: on-failure
  migrate:
    build: .
    command: [npm, run, db:migrate]
    environment: &app-env
      DATABASE_URL: postgresql://todo:${POSTGRES_PASSWORD}@postgres:5432/todo
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-todo-private}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:23330}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build: .
    command: [node, node_modules/next/dist/bin/next, start, --port, "3000"]
    ports: ["127.0.0.1:23330:3000"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      init-storage: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: .
    command: [npm, run, worker]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      init-storage: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 45s
volumes:
  postgres-data:
  redis-data:
  minio-data:
